name: Build ZUS
# CHẶNG 1 của pipeline 2 chặng. Build 3 OS ngay tại repo public này rồi upload lên release.
# Chặng 2 (`.github/workflows/sign.yml` bên repo PRIVATE 8syncdev/zus) tải về, ký bằng khoá
# THẬT, dựng + ký `latest.json`, rồi đẩy ngược lên đây.
#
# Vì sao tách 2 chặng:
#   - Build tốn phút. Doc GitHub: "Actions usage is free for … public repositories" ⇒ chạy ở đây
#     là $0, kể cả macOS ($0.062/′ ≈ 10× Linux trên repo private — 1 release = 22% định mức Free).
#   - Ký thì KHÔNG tốn gì, nhưng cần khoá bí mật. Khoá ký auto-update là thứ nguy hiểm nhất trong
#     dự án: lộ = ký được bản cập nhật độc cho MỌI user. Nên nó ở nguyên secret của repo private,
#     KHÔNG copy sang đây.
#
# Source private KHÔNG bị lộ:
#   - Checkout bằng **deploy key read-only scope đúng `8syncdev/zus`** (không phải PAT toàn
#     account). Source chỉ nằm trên runner tạm rồi bị huỷ; repo này không chứa source.
#   - Log build công khai chỉ in code khi BIÊN DỊCH LỖI. Đã chặn từ gốc: codebase có 0 khối
#     `cfg(target_os = "windows"/"macos")` (Rust biên dịch giống hệt mọi OS) và `scripts/release.sh`
#     chạy `gate.sh all` + `gate.sh build` (bundle vite thật) ở LOCAL trước khi tag.
#   - `workflow_dispatch` là trigger DUY NHẤT ⇒ fork/PR không bao giờ chạm được secret.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag đã push trên 8syncdev/zus (vd v1.2.0)'
        required: true
      platforms:
        description: 'linux = smoke test nhanh; all = phát hành thật'
        type: choice
        options: [all, linux]
        default: all
      dry_run:
        description: 'Chỉ verify wiring (checkout + version gate) — KHÔNG build, KHÔNG đụng release'
        type: boolean
        default: false
      ref:
        description: 'Commit-ish để build (mặc định = tag). Đặt `main` để thử wiring trước khi tag tồn tại.'
        default: ''
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Phải dựng bằng `fromJSON` chứ không lọc bằng `if` cấp job: context `matrix` KHÔNG khả
        # dụng ở `jobs.<id>.if` (chỉ có github/inputs/needs/vars).
        # - ubuntu-24.04: ort-sys (ONNX prebuilt, dep zus-index) đòi glibc ≥2.38 ⇒ sàn glibc của
        #   installer là ràng buộc từ DEP. Build trên distro mới hơn (vd Arch glibc 2.43) ra
        #   installer chết trên gần như mọi user.
        # - macos: aarch64-only vì ort-sys 2.0.0-rc.12 KHÔNG có prebuilt x86_64-apple-darwin.
        include: ${{ inputs.platforms == 'linux' && fromJSON('[{"platform":"ubuntu-24.04","args":"--bundles deb,rpm,appimage","rust-targets":""}]') || fromJSON('[{"platform":"ubuntu-24.04","args":"--bundles deb,rpm,appimage","rust-targets":""},{"platform":"macos-latest","args":"--target aarch64-apple-darwin --bundles app,dmg","rust-targets":"aarch64-apple-darwin"},{"platform":"windows-latest","args":"--bundles nsis","rust-targets":""}]') }}
    runs-on: ${{ matrix.platform }}
    env:
      # Ký số Windows (Azure Trusted Signing) — tự kích hoạt khi set đủ 6 secrets; thiếu = skip.
      # Khác hoàn toàn khoá updater: đây là code-signing chống SmartScreen, không ký bản cập nhật.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
      AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
      AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
    steps:
      - name: Checkout source private (deploy key read-only)
        uses: actions/checkout@v5
        with:
          repository: 8syncdev/zus
          ref: ${{ inputs.ref || inputs.tag }}
          ssh-key: ${{ secrets.ZUS_SRC_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      # Tự đọc `packageManager` rồi truyền thẳng cho action: vẫn đúng 1 nguồn sự thật
      # (package.json), nhưng không phụ thuộc cơ chế dò của `pnpm/action-setup` — cơ chế đó báo
      # "No pnpm version is specified" một cách mơ hồ khi field vắng mặt (vd tag cũ trước r41).
      - name: pnpm version từ packageManager
        id: pm
        shell: bash
        run: |
          set -euo pipefail
          # KHÔNG viết `echo "v=$(node …)"`: lệnh trong $() fail thì `echo` vẫn exit 0 ⇒ output
          # rỗng và lỗi thật lòi ra tận step sau dưới dạng thông báo lạc đề.
          v=$(node -p "require('./package.json').packageManager?.split('@')[1] ?? ''")
          [ -n "$v" ] || { echo "::error::package.json thiếu field packageManager"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4 # v6 self-installer crash với pnpm 11.12.0
        with:
          version: ${{ steps.pm.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:full
      # Chốt cuối chống nhầm tag: 3 file version phải khớp nhau VÀ khớp tag, CHANGELOG phải có
      # heading. Rẻ (vài giây) và chặn được cả class lỗi "tag trỏ nhầm commit".
      - name: Version phải khớp tag
        shell: bash
        run: bash scripts/gate.sh version "${{ inputs.tag }}"
      # KHOÁ RÁC — cố ý. `tauri.conf.json` có `plugins.updater.pubkey` nên tauri-cli BẮT BUỘC phải
      # có private key, nếu không thì `sign_updaters()` fail cứng exit 1 SAU khi artifact đã ghi
      # xong đĩa ("A public key has been found, but no private key" — tauri-cli/src/bundle.rs:277).
      # Khoá rác làm build exit 0; nó chỉ đẻ ra `.sig` VÔ GIÁ TRỊ, sẽ bị chặng 2 ghi đè bằng khoá
      # thật. Keynum lệch pubkey chỉ là `log::warn!` (bundle.rs:304), KHÔNG phải lỗi.
      # KHÔNG dùng `--no-sign` thay thế: trên macOS nó tắt luôn ad-hoc codesign của `.app`
      # (tauri-bundler macos/app.rs:115) ⇒ app arm64 không chạy được.
      - name: Khoá ký RÁC cho chặng 1 (khoá thật ở repo private)
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tauri signer generate -w "$RUNNER_TEMP/throwaway.key" -f --password ""
          # rsign secret is one line with NO trailing newline. GITHUB_ENV multiline
          # values end on a LINE equal to the delimiter — cat without an extra
          # newline glued `__EOF__` onto the key → "Matching delimiter not found".
          delim="EOF_TAURI_$(python3 -c 'import secrets; print(secrets.token_hex(8))')"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<${delim}"
            cat "$RUNNER_TEMP/throwaway.key"
            printf '\n'
            echo "${delim}"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD="
          } >> "$GITHUB_ENV"
      - name: Install trusted-signing-cli (Windows signing)
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        run: cargo install trusted-signing-cli --locked
      - name: Enable Windows signing overlay
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        shell: bash
        run: |
          printf '{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e %s -a %s -c %s %%1"}}}' \
            "$AZURE_TS_ENDPOINT" "$AZURE_TS_ACCOUNT" "$AZURE_TS_PROFILE" > src-tauri/windows-sign.conf.json
          echo "ZUS_SIGN_ARGS=--config src-tauri/windows-sign.conf.json" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: ${{ inputs.tag }}
          releaseName: 'ZUS ${{ inputs.tag }}'
          releaseBody: 'See install & verify instructions in the [README](https://github.com/8syncdev/zus-releases#install). Verify downloads with SHA256SUMS.txt.'
          # Release để DRAFT tới khi chặng 2 ký xong: manifest lúc này còn mang chữ ký RÁC, publish
          # ra là updater của user fail-closed từ chối ⇒ kênh cập nhật chết im lặng.
          releaseDraft: true
          prerelease: false
          # `latest.json` do chặng 2 dựng (gộp cả 3 OS rồi ký MỘT lần bằng khoá thật). Để
          # tauri-action sinh bản mang chữ ký rác ở đây chỉ tổ gây nhầm.
          includeUpdaterJson: false
          args: ${{ matrix.args }} ${{ env.ZUS_SIGN_ARGS }}

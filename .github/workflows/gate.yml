name: ZUS Gate

# The scripts/gate.sh of the PRIVATE repo 8-Sync-Dev/zus (FE, Rust and bundle lanes), run on GitHub's
# hosted runners from this PUBLIC repo, where Actions minutes are free. Free is the only reason it
# lives here, so the job's PUBLIC surface is kept to what cannot identify code:
#
#   - The job log prints `gate:` lines only (stage names and seconds): gate.sh runs with
#     GATE_QUIET=1, which sends every lane's own output (tsc, eslint, vitest, cargo, vite) to a file.
#   - That file is uploaded ENCRYPTED to the owner's age public key (vars.GATE_LOG_AGE_RECIPIENT);
#     the private key is on the owner's machine, never on GitHub. Decrypt:
#       gh run download <run_id> -R 8-Sync-Dev/zus-releases -n gate-logs && age -d -i <key> gate-logs.tar.age | tar x
#   - "What changed" writes the changed-file list to a file; only the count reaches the log.
#   - The result goes back to the private repo as a COMMIT STATUS (context `gate`), posted with
#     ZUS_STATUS_PAT (commit statuses RW on zus only), so the PR in zus shows pass/fail and the
#     link to this run. Nobody needs to look here except when it is red.
#
# Triggers: a 5-min schedule that asks zus for open PRs into dev-fe and `ship/*` branches and
# gates every head commit that has no `gate` status yet (the private repo cannot run even a
# 5-second dispatcher job: its included minutes are spent, 2026-10-17), `repository_dispatch`
# type `zus-gate` for an immediate run, and `workflow_dispatch` by hand. Never push/pull_request
# here: a fork or PR against this repo must not reach the deploy key.
on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [zus-gate]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit of 8-Sync-Dev/zus to gate (full sha)
        type: string
        required: true
      base:
        description: Scope the lanes to the files changed since this ref (empty = both lanes in full)
        type: string
        default: ""
      status:
        description: Post the result as a commit status on zus
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  discover:
    name: discover
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    steps:
      - name: Heads without a gate status
        id: find
        env:
          GH_TOKEN: ${{ secrets.ZUS_STATUS_PAT }}
        run: |
          set -eu
          R=repos/8-Sync-Dev/zus
          # PR heads (base = the PR's base sha) and ship/* branch heads (base = merge base with dev-fe).
          cands=$(gh api "$R/pulls?base=dev-fe&state=open&per_page=50" --jq '.[] | select(.head.repo.full_name == "8-Sync-Dev/zus") | "\(.head.sha) \(.base.sha) \(.head.ref)"')
          for b in $(gh api "$R/branches?per_page=100" --paginate --jq '.[].name | select(startswith("ship/"))'); do
            sha=$(gh api "$R/branches/$b" --jq .commit.sha)
            echo "$cands" | grep -q "^$sha " && continue
            mb=$(gh api "$R/compare/dev-fe...$sha" --jq .merge_base_commit.sha 2>/dev/null || echo "")
            cands="$cands"$'\n'"$sha $mb $b"
          done
          targets='[]'
          while read -r sha base ref; do
            [ -n "$sha" ] || continue
            # Already gated, or running: the status is set at the start of every run.
            if gh api "$R/commits/$sha/status" --jq '.statuses[] | select(.context == "gate") | .state' | grep -q .; then continue; fi
            targets=$(echo "$targets" | jq -c --arg sha "$sha" --arg base "$base" --arg ref "$ref" '. + [{sha:$sha, base:$base, ref:$ref}]')
          done <<< "$cands"
          echo "targets: $(echo "$targets" | jq length)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  gate:
    name: gate
    needs: [discover]
    # `needs` of a skipped job: the dispatch events skip `discover`; `always()` keeps `gate` eligible.
    if: always() && (github.event_name != 'schedule' || needs.discover.outputs.targets != '[]')
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'schedule' && fromJSON(needs.discover.outputs.targets) || fromJSON(format('[{{"sha":"{0}","base":"{1}","ref":"{2}"}}]', github.event.client_payload.sha || inputs.sha, github.event.client_payload.base || inputs.base, github.event.client_payload.ref || '')) }}
    concurrency:
      # One run per commit; a second schedule tick must not double up.
      group: zus-gate-${{ matrix.target.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHA: ${{ matrix.target.sha }}
      BASE: ${{ matrix.target.base }}
      REF: ${{ matrix.target.ref }}
      POST_STATUS: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.status }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Status → pending
        if: env.POST_STATUS == 'true'
        env:
          GH_TOKEN: ${{ secrets.ZUS_STATUS_PAT }}
        run: |
          gh api -X POST "repos/8-Sync-Dev/zus/statuses/$SHA" -f state=pending -f context=gate \
            -f description="running on zus-releases" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      # No `rm -rf /usr/share/dotnet …` purge: it cost 1 min 45 s (run 38997630272); the Rust test
      # build fits in the hosted image's free disk (the purge only existed for the VPS's 14 GB).
      - run: df -h / | tail -1
      - name: Checkout zus (deploy key, read-only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: 8-Sync-Dev/zus
          ref: ${{ env.SHA }}
          ssh-key: ${{ secrets.ZUS_SRC_DEPLOY_KEY }}
          persist-credentials: false
      # This log is public. A gate.sh without GATE_QUIET (anything older than
      # ship/gate-under-5min) prints tsc/cargo errors, i.e. private paths and names, straight
      # into it (job 117344346857 of run 39014686667). Gate nothing from such a commit.
      - name: Quiet gate.sh required
        id: quiet
        run: |
          grep -q 'GATE_QUIET' scripts/gate.sh && exit 0
          echo "::error::scripts/gate.sh at this commit has no GATE_QUIET mode; merge dev-fe (with ship/gate-under-5min) into the branch and push"
          exit 1
      - name: What changed
        id: changed
        env:
          GH_TOKEN: ${{ secrets.ZUS_STATUS_PAT }}
        run: |
          set -eu
          rust=true; fe=true; admin=true; scoped=false
          : > "$RUNNER_TEMP/zus-changed.txt"
          if [ -n "$BASE" ]; then
            files=$(gh api "repos/8-Sync-Dev/zus/compare/$BASE...$SHA" --paginate --jq '.files[] | .filename, (.previous_filename // empty)' 2>/dev/null) || files=""
            if [ -n "$files" ]; then
              both='^(scripts/gate\.sh|scripts/rust-affected\.mjs|scripts/ts-native/.*|\.github/workflows/zus-gate\.yml)$'
              rustpat='^(Cargo\.(toml|lock)|rust-toolchain|\.cargo/|crates/|src-tauri/)|\.rs$'
              rustjson='^src/vs/workbench/contrib/zusChat/browser/(zusCoreTools|zusSlashReserved)\.json$'
              if ! echo "$files" | grep -Eq "$both"; then
                echo "$files" | grep -Eq "$rustpat|$rustjson" || rust=false
                echo "$files" | grep -Ev "$rustpat" | grep -Ev '\.md$' | grep -q . || fe=false
                if [ "$(echo "$files" | wc -l)" -lt 300 ]; then
                  scoped=true
                  echo "$files" > "$RUNNER_TEMP/zus-changed.txt"
                fi
              fi
              echo "$files" | grep -Eq '^(apps/admin/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|scripts/gate\.sh$)' || admin=false
              # Count only: the paths stay out of the public log.
              echo "changed: $(echo "$files" | wc -l) files → rust=$rust fe=$fe admin=$admin scoped=$scoped"
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "fe=$fe" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "scoped=$scoped" >> "$GITHUB_OUTPUT"
      - name: Linux system deps (Tauri)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev pkg-config age >/dev/null
      - name: pnpm version from packageManager
        id: pm
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').packageManager?.split('@')[1] ?? ''")
          [ -n "$v" ] || { echo "::error::package.json lacks packageManager"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ steps.pm.outputs.version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Rust toolchain (repo pin)
        if: steps.changed.outputs.rust == 'true'
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.changed.outputs.rust == 'true'
        with:
          workspaces: .
          shared-key: gate
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile >/dev/null
      - name: TypeScript 7 (native tsc)
        if: steps.changed.outputs.fe == 'true'
        run: |
          npm ci --prefix scripts/ts-native --no-audit --no-fund --ignore-scripts >/dev/null
          tsc=scripts/ts-native/node_modules/typescript/bin/tsc
          "$tsc" --version
          echo "GATE_TSC_BIN=$PWD/$tsc" >> "$GITHUB_ENV"
      - name: Frontend gate
        if: steps.changed.outputs.fe == 'true'
        env:
          GATE_QUIET: "1"
          NODE_OPTIONS: --max-old-space-size=6144
          VITEST_MAX_WORKERS: "4"
          GATE_TSC_TEST: "1"
          GATE_ADMIN_BUILD: ${{ steps.changed.outputs.admin == 'false' && '0' || '1' }}
        run: |
          if [ '${{ steps.changed.outputs.scoped }}' = true ]; then
            export GATE_VITEST_CHANGED="$RUNNER_TEMP/zus-changed.txt"
          fi
          bash scripts/gate.sh fe
      - name: Rust gate
        if: steps.changed.outputs.rust == 'true'
        env:
          GATE_QUIET: "1"
        run: |
          if [ '${{ steps.changed.outputs.scoped }}' = true ]; then
            GATE_RUST_PACKAGES="$(cargo metadata --format-version 1 --no-deps --locked | node scripts/rust-affected.mjs "$RUNNER_TEMP/zus-changed.txt")"
            export GATE_RUST_PACKAGES
          fi
          bash scripts/gate.sh rust
      # The production bundle (Vite/rollup/esbuild). The FE lane only runs `tsc --noEmit`, which
      # never emits, so a broken bundle surfaced first in release.yml's public log, with the code
      # frame around the error. Only a gate.sh whose `build` lane runs through `retain_lane`
      # (zus card #30) keeps that output in the encrypted lane log; an older one prints it straight
      # here, so its commits are not bundle-gated.
      - name: Bundle gate
        if: steps.changed.outputs.fe == 'true'
        env:
          GATE_QUIET: "1"
        run: |
          if ! grep -Eq '^ *build\) +retain_lane build' scripts/gate.sh; then
            echo "::notice::scripts/gate.sh at this commit has no quiet build lane: bundle not gated"
            exit 0
          fi
          bash scripts/gate.sh build
      # The lane logs, encrypted to the owner. `always()`: a red lane is the one worth reading.
      - name: Encrypt lane logs
        # No lane ran when the quiet check refused the commit: nothing to keep (and `age` is not installed yet).
        if: always() && steps.quiet.outcome == 'success'
        env:
          RECIPIENT: ${{ vars.GATE_LOG_AGE_RECIPIENT }}
        run: |
          [ -n "$RECIPIENT" ] || { echo "::warning::vars.GATE_LOG_AGE_RECIPIENT unset: lane logs not kept"; exit 0; }
          mkdir -p .tmp
          cp "$RUNNER_TEMP/zus-changed.txt" .tmp/changed-files.txt 2>/dev/null || true
          tar c .tmp/*.log .tmp/changed-files.txt 2>/dev/null | age -r "$RECIPIENT" -o "$RUNNER_TEMP/gate-logs.tar.age"
          ls -l "$RUNNER_TEMP/gate-logs.tar.age"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-logs
          path: ${{ runner.temp }}/gate-logs.tar.age
          retention-days: 14
          if-no-files-found: ignore
      - name: Status → result
        if: always() && env.POST_STATUS == 'true'
        env:
          GH_TOKEN: ${{ secrets.ZUS_STATUS_PAT }}
          OUTCOME: ${{ job.status }}
          QUIET: ${{ steps.quiet.outcome }}
        run: |
          [ "$QUIET" = failure ] && OUTCOME=stale
          case "$OUTCOME" in
            stale) state=error; desc="gate.sh predates quiet mode: merge dev-fe (after #43) and push" ;;
            success) state=success; desc="FE+Rust lanes green" ;;
            cancelled) state=error; desc="cancelled" ;;
            *) state=failure; desc="a lane is red: decrypt artifact gate-logs" ;;
          esac
          gh api -X POST "repos/8-Sync-Dev/zus/statuses/$SHA" -f state=$state -f context=gate \
            -f description="$desc" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
